# ============================================================
# GlobalIntelligence — Environment Manifest (Phase 1)
# نسخه‌های مرجع توسعه. نسخه‌ها را در CI/تیم یکسان نگه دارید.
# ============================================================

[toolchain]
python  = ">=3.11,<3.15"     # توسعه روی 3.14.4 تست شده
node    = ">=18,<25"         # توسعه روی 24.16.0 تست شده
npm     = ">=9"
docker  = ">=24"             # CLI توسعه روی 23.x، Compose v2
compose = ">=2.0"
git     = ">=2.40"

[resources]
# حداقل منابع ماشین برای اجرای کامل Docker stack
min_cpu_cores = 2
recommended_cpu_cores = 4
min_ram_gb = 8
min_disk_gb = 40

[notes]
# - Docker Daemon در زمان تست اجرا نشده بود؛ برای Phase 2 لازم است.
# - uv و make نصب نیستند و اجباری هم نیستند (استفاده اجباری نشد).
# - هیچ API پولی برای توسعه لازم نیست (MOCK_MODE=true).
