name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: globalintelligence
          POSTGRES_USER: gi_user
          POSTGRES_PASSWORD: gi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gi_user -d globalintelligence"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://gi_user:gi_password@localhost:5432/globalintelligence
      MOCK_MODE: "true"
      APP_ENV: development
      API_KEY: ""
      APP_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend domains tests scripts source_bot
      - name: Legacy UI guard (F03.UX.8 — retired files must stay absent)
        run: python scripts/check_legacy_ui_backup.py --live-only
      - name: Run migrations (up/down)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Verify migration head
        run: alembic heads
      - name: Full test suite (PostgreSQL)
        timeout-minutes: 30
        run: |
          pytest tests -q --basetemp=.pytest-ci

  backend-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOCK_MODE: "true"
      APP_ENV: development
      API_KEY: ""
      APP_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Run SQLite-compatible tests
        timeout-minutes: 30
        working-directory: backend
        run: pytest ../tests -q -m "not pg" --basetemp=.pytest-sqlite

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t gi-backend:ci .
