name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: globalintelligence
          POSTGRES_USER: gi_user
          POSTGRES_PASSWORD: gi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gi_user -d globalintelligence"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://gi_user:gi_password@localhost:5432/globalintelligence
      MOCK_MODE: "true"
      APP_ENV: development
      API_KEY: ""
      APP_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend domains tests scripts source_bot
      - name: Run migrations (up/down)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Verify migration head
        run: alembic heads
      - name: Dispatch & persistence integration tests (PostgreSQL)
        run: |
          echo "=== test_article_dispatch_migration ==="
          pytest tests/test_article_dispatch_migration.py -q
          echo "=== test_dispatch ==="
          pytest tests/test_dispatch.py -q
          echo "=== test_domain_routing ==="
          pytest tests/test_domain_routing.py -q
          echo "=== test_domain_routing_refresh ==="
          pytest tests/test_domain_routing_refresh.py -q
          echo "=== test_domain_engines ==="
          pytest tests/test_domain_engines.py -q
      - name: Full test suite
        run: pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t gi-backend:ci .
      - name: Build frontend prod image
        run: docker build -f docker/frontend.prod.Dockerfile -t gi-frontend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: apps/web
        run: |
          npm ci || npm install
          npm run build
