[project]
name = "globalintelligence-backend"
version = "0.0.0"
description = "GlobalIntelligence backend — intelligence, evidence & decision support platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "feedparser>=6.0,<7",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
# قواعد کاربردی؛ الگوهای خاص FastAPI و SQLAlchemy نادیده گرفته می‌شوند
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends()/Query() در default argument — الگوی استاندارد
    "E501",   # طول خط — به‌عهده‌ی formatter
    "UP042",  # str+Enum — عمداً برای سازگاری
    "RUF012", # mutable class default
    "PERF102",
    "TRY004",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
